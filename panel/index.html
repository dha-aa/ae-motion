<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AE Motion MCP</title>
<style>
  body { margin: 0; padding: 12px; background: #232323; color: #d8d8d8; font: 12px/1.5 system-ui, sans-serif; }
  h1 { font-size: 13px; margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; border-top: 1px solid #333; padding: 3px 0; }
  .k { color: #888; }
  #status.ok { color: #7fd17f; }
  #status.bad { color: #ff8a80; }
  #update { color: #ffd479; }
  .actions { margin-top: 8px; display: flex; gap: 8px; align-items: center; }
  button { background: #3a3a3a; color: #e0e0e0; border: 1px solid #555; border-radius: 3px; padding: 3px 10px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: #4a4a4a; }
  button:disabled { opacity: 0.5; cursor: default; }
  #update-log { margin: 6px 0 0; padding: 6px; background: #1b1b1b; border-radius: 3px; white-space: pre-wrap; word-break: break-word; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #bbb; }
  #update-log.bad { color: #ff8a80; }
  h2 { font-size: 12px; margin: 12px 0 4px; display: flex; justify-content: space-between; }
  h2 small { color: #777; font-weight: normal; }
  .big { color: #ffd479; font-weight: 600; }
  #tok-sessions .row .live { color: #7fd17f; }
  #tok-top { color: #999; font-size: 11px; padding-top: 3px; border-top: 1px solid #333; }
</style>
</head>
<body>
  <h1>AE Motion MCP</h1>
  <div class="row"><span class="k">Bridge</span><span id="status">starting...</span></div>
  <div class="row"><span class="k">Commands run</span><span id="count">0</span></div>
  <div class="row"><span class="k">Last command</span><span id="last">-</span></div>
  <div class="row"><span class="k">Last error</span><span id="err">-</span></div>
  <div class="row"><span class="k">Version</span><span id="version">-</span></div>
  <div class="row" id="update-row" style="display:none"><span class="k">Update</span><span id="update" class="bad"></span></div>
  <h2 title="Estimated tokens ae-motion adds to the model's context: tool results (text at ~3.6 characters per token, images at width x height / 750) and its tool definitions. Your client's total also includes your messages and the model's replies.">Tokens <small>estimate &#9432;</small></h2>
  <div id="tok-sessions"><div class="k">No sessions yet</div></div>
  <div class="row" title="Sent with every request; most clients cache it, which makes repeats much cheaper. AE_MCP_TOOLSETS=core shrinks it."><span class="k">Tool definitions</span><span id="tok-defs">-</span></div>
  <div class="row"><span class="k">Today (all sessions)</span><span id="tok-today">-</span></div>
  <div id="tok-top"></div>
  <div class="actions"><button id="update-btn" data-label="Reinstall" title="git pull, then re-run the installer, then restart this panel">Reinstall</button></div>
  <pre id="update-log" style="display:none"></pre>
  <script src="main.js"></script>
</body>
</html>
