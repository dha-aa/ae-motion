name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # No After Effects in CI: the suite uses a mock AE DOM, a fake bridge and a fake aerender.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
