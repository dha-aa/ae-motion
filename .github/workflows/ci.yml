name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run every job, macOS included, from the Actions tab

# A newer push to the same branch or pull request cancels the older run, so stale jobs do not wait in the runner queues.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # No After Effects in CI: the suite uses a mock AE DOM, a fake bridge and a fake aerender.
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: Linux and Windows only, done in about a minute. macOS runs on main after each merge (and from
        # the Actions tab): GitHub's macOS arm64 runners are short of capacity, and a job waiting for one held up
        # pull requests for 15 minutes and more, then was cancelled ("not acquired by Runner").
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["macos-latest", "ubuntu-latest", "windows-latest"]') }}
        node: [22, 24] # Node 22.18+ runs the .ts tests and scripts directly (type stripping)
        # macOS once, on the oldest Node we support; Node 24 is tested on Linux and Windows.
        exclude:
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
